<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merv M — 3D</title>
<link rel="icon" href="favicon-32.png">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(120% 90% at 30% 15%, #fbfaf7 0%, #e6e4df 55%, #cfccc5 100%); }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
</style>
</head>
<body>
<model-viewer src="merv-m-black.glb" alt="The Merv M in 3D"
  camera-controls auto-rotate auto-rotate-delay="0" rotation-per-second="24deg"
  camera-orbit="20deg 78deg auto" field-of-view="26deg"
  interaction-prompt="none" touch-action="pan-y"
  environment-image="neutral" exposure="1.0" tone-mapping="aces"
  shadow-intensity="1.2" shadow-softness="0.8">
</model-viewer>
</body>
</html>
